<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问卷数据管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
            background: #ffffff;
            min-height: 100vh;
            padding: 20px;
            color: #000;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
            border-bottom: 1px solid #e5e5e7;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            padding: 20px;
            background: #f9f9fb;
            border-radius: 8px;
            border: 1px solid #e5e5e7;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 600;
            color: #0A84FF;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #8E8E93;
            margin-top: 8px;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            border: 2px solid #e5e5e7;
            border-radius: 8px;
            background: #ffffff;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        button:hover {
            border-color: #0A84FF;
            background: #f9f9fb;
        }

        button.danger {
            border-color: #FF3B30;
            color: #FF3B30;
        }

        button.danger:hover {
            background: #fff5f5;
        }

        .responses-table {
            width: 100%;
            border-collapse: collapse;
            margin: 30px 0;
            border: 1px solid #e5e5e7;
            border-radius: 8px;
            overflow: hidden;
        }

        .responses-table thead {
            background: #f9f9fb;
        }

        .responses-table th,
        .responses-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #e5e5e7;
        }

        .responses-table th {
            font-weight: 600;
            color: #000;
        }

        .responses-table td {
            color: #666;
            font-size: 0.95rem;
        }

        .responses-table tbody tr:hover {
            background: #f9f9fb;
        }

        .responses-table tbody tr:last-child td {
            border-bottom: none;
        }

        .delete-btn {
            padding: 6px 12px;
            font-size: 0.85rem;
            color: #FF3B30;
            border: 1px solid #FF3B30;
        }

        .delete-btn:hover {
            background: #fff5f5;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8E8E93;
        }

        .empty-state h2 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #000;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .modal h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .modal p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .modal-actions button {
            min-width: 100px;
        }
        /* 登录页面 */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #ffffff;
            z-index: 2000;
        }

        .login-screen.hidden {
            display: none;
        }

        .login-box {
            background: #f9f9fb;
            border-radius: 12px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .login-box h2 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-align: center;
        }

        .login-input {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            border: 2px solid #e5e5e7;
            border-radius: 8px;
            font-family: inherit;
            transition: border-color 0.2s;
            background: #ffffff;
        }

        .login-input:focus {
            outline: none;
            border-color: #0A84FF;
        }

        .login-btn {
            width: 100%;
            margin-top: 20px;
            background: #0A84FF;
            color: white;
            border: none;
            padding: 14px;
            font-weight: 600;
        }

        .login-btn:hover {
            background: #0077ED;
            border-color: #0077ED;
        }

        .login-error {
            color: #FF3B30;
            font-size: 0.9rem;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .login-error.show {
            display: block;
        }
    </style>
</head>
<body>
    <!-- 登录页面 -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <h2>管理员登录</h2>
            <input type="password" id="passwordInput" class="login-input" placeholder="请输入密码" autocomplete="off">
            <button id="loginBtn" class="login-btn">登录</button>
            <div id="loginError" class="login-error" role="alert"></div>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>问卷数据管理</h1>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">总响应数</div>
                </div>
            </div>
        </header>

        <div class="controls">
            <button id="exportJson">导出 JSON</button>
            <button id="exportCsv">导出 CSV</button>
            <button id="clearAll" class="danger">清除所有数据</button>
            <a href="index.html" style="text-decoration: none;">
                <button>返回问卷</button>
            </a>
        </div>

        <p id="adminError" class="login-error" role="alert"></p>
        <div id="responsesContainer"></div>
    </div>

    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h2>确认删除</h2>
            <p id="confirmText"></p>
            <div class="modal-actions">
                <button id="cancelBtn">取消</button>
                <button id="confirmBtn" class="danger">删除</button>
            </div>
        </div>
    </div>

    <script src="data-manager.js"></script>
    <script>
        // The password is verified by the Worker and is never embedded in this page.
        const loginScreen = document.getElementById('loginScreen');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        async function checkPassword() {
            loginBtn.disabled = true;
            loginError.classList.remove('show');
            try {
                await dataManager.login(passwordInput.value);
                passwordInput.value = '';
                loginScreen.classList.add('hidden');
                try {
                    await loadResponses();
                } catch (error) {
                    showAdminError(error);
                }
            } catch (error) {
                loginError.textContent = error.message;
                loginError.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
            } finally {
                loginBtn.disabled = false;
            }
        }

        loginBtn.addEventListener('click', checkPassword);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        let deleteTarget = null;

        function showAdminError(error) {
            const element = document.getElementById('adminError');
            element.textContent = error.message || '操作失败，请稍后重试。';
            element.classList.add('show');
        }

        function formatDate(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('zh-CN');
        }

        async function loadResponses() {
            document.getElementById('adminError').classList.remove('show');
            const responses = await dataManager.getAllResponses();
            const container = document.getElementById('responsesContainer');

            document.getElementById('totalCount').textContent = responses.length;

            if (responses.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>暂无数据</h2>
                        <p>还没有收集到问卷响应</p>
                    </div>
                `;
                return;
            }

            const table = document.createElement('table');
            table.className = 'responses-table';

            const headers = ['ID', '时间', '数据', '操作'];
            const thead = table.createTHead();
            const headerRow = thead.insertRow();
            headers.forEach(h => {
                const th = document.createElement('th');
                th.textContent = h;
                headerRow.appendChild(th);
            });

            const tbody = table.createTBody();
            responses.forEach(response => {
                const row = tbody.insertRow();

                const idCell = row.insertCell();
                idCell.textContent = response.id;

                const timeCell = row.insertCell();
                timeCell.textContent = formatDate(response.timestamp);

                const dataCell = row.insertCell();
                dataCell.textContent = JSON.stringify(response).substring(0, 50) + '...';

                const actionCell = row.insertCell();
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = '删除';
                deleteBtn.onclick = () => showDeleteConfirm(response.id);
                actionCell.appendChild(deleteBtn);
            });

            container.innerHTML = '';
            container.appendChild(table);
        }

        function showDeleteConfirm(id) {
            deleteTarget = id;
            document.getElementById('confirmText').textContent = `确认删除 ID 为 ${id} 的问卷响应吗？此操作不可撤销。`;
            document.getElementById('confirmModal').classList.add('active');
        }

        async function confirmDelete() {
            if (deleteTarget) {
                try {
                    await dataManager.deleteResponse(deleteTarget);
                    deleteTarget = null;
                    document.getElementById('confirmModal').classList.remove('active');
                    await loadResponses();
                } catch (error) {
                    showAdminError(error);
                }
            }
        }

        function cancelDelete() {
            deleteTarget = null;
            document.getElementById('confirmModal').classList.remove('active');
        }

        async function showClearConfirm() {
            deleteTarget = 'all';
            document.getElementById('confirmText').textContent = '确认清除所有问卷数据吗？此操作不可撤销。';
            document.getElementById('confirmModal').classList.add('active');
        }

        document.getElementById('exportJson').addEventListener('click', async () => {
            try {
                dataManager.exportAsJSON(await dataManager.getAllResponses());
            } catch (error) { showAdminError(error); }
        });

        document.getElementById('exportCsv').addEventListener('click', async () => {
            try {
                dataManager.exportAsCSV(await dataManager.getAllResponses());
            } catch (error) { showAdminError(error); }
        });

        document.getElementById('clearAll').addEventListener('click', showClearConfirm);

        document.getElementById('confirmBtn').addEventListener('click', async () => {
            if (deleteTarget === 'all') {
                try {
                    await dataManager.clearAll();
                    deleteTarget = null;
                    document.getElementById('confirmModal').classList.remove('active');
                    await loadResponses();
                } catch (error) { showAdminError(error); }
            } else {
                confirmDelete();
            }
        });

        document.getElementById('cancelBtn').addEventListener('click', cancelDelete);

        document.getElementById('confirmModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('confirmModal')) {
                cancelDelete();
            }
        });

    </script>
</body>
</html>
