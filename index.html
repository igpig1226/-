<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问卷调查</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="survey-container">
        <!-- 进度条 -->
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <!-- 进度指示 -->
        <div class="progress-indicator">
            <span id="currentQuestion">1</span> / <span id="totalQuestions">4</span>
        </div>

        <!-- 问卷内容 -->
        <main class="survey-main">
            <form id="surveyForm">
                <!-- 第一题 -->
                <div class="question-card" data-question="0">
                    <div class="question-content">
                        <h2 class="question-title">这是一个单选题示例</h2>
                        <div class="options">
                            <label class="option-item">
                                <input type="radio" name="q1" value="选项A">
                                <span class="option-text">选项A</span>
                            </label>
                            <label class="option-item">
                                <input type="radio" name="q1" value="选项B">
                                <span class="option-text">选项B</span>
                            </label>
                            <label class="option-item">
                                <input type="radio" name="q1" value="选项C">
                                <span class="option-text">选项C</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 第二题 -->
                <div class="question-card" data-question="1">
                    <div class="question-content">
                        <h2 class="question-title">这是一个多选题示例</h2>
                        <div class="options">
                            <label class="option-item">
                                <input type="checkbox" name="q2" value="选项1">
                                <span class="option-text">选项1</span>
                            </label>
                            <label class="option-item">
                                <input type="checkbox" name="q2" value="选项2">
                                <span class="option-text">选项2</span>
                            </label>
                            <label class="option-item">
                                <input type="checkbox" name="q2" value="选项3">
                                <span class="option-text">选项3</span>
                            </label>
                            <label class="option-item">
                                <input type="checkbox" name="q2" value="选项4">
                                <span class="option-text">选项4</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 第三题 -->
                <div class="question-card" data-question="2">
                    <div class="question-content">
                        <h2 class="question-title">这是一个文本输入示例</h2>
                        <textarea name="q3" class="text-input" placeholder="请输入您的答案..."></textarea>
                    </div>
                </div>

                <!-- 第四题 -->
                <div class="question-card" data-question="3">
                    <div class="question-content">
                        <h2 class="question-title">评分题示例（1-5分）</h2>
                        <div class="rating-options">
                            <label class="rating-item">
                                <input type="radio" name="q4" value="1">
                                <span class="rating-text">1</span>
                            </label>
                            <label class="rating-item">
                                <input type="radio" name="q4" value="2">
                                <span class="rating-text">2</span>
                            </label>
                            <label class="rating-item">
                                <input type="radio" name="q4" value="3">
                                <span class="rating-text">3</span>
                            </label>
                            <label class="rating-item">
                                <input type="radio" name="q4" value="4">
                                <span class="rating-text">4</span>
                            </label>
                            <label class="rating-item">
                                <input type="radio" name="q4" value="5">
                                <span class="rating-text">5</span>
                            </label>
                        </div>
                    </div>
                </div>
            </form>
        </main>

        <!-- 导航按钮 -->
        <div class="navigation">
            <button id="prevBtn" class="nav-btn nav-btn-prev" disabled>
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M12 16L6 10L12 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button id="nextBtn" class="nav-btn nav-btn-next">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M8 16L14 10L8 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

        <!-- 感谢页面 -->
        <div id="thankYou" class="thank-you-screen" style="display: none;">
            <h1>感谢您的参与</h1>
            <p>您的反馈对我们非常重要</p>
            <a href="admin.html" style="margin-top: 30px; display: inline-block;">
                <button style="background: #0A84FF; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 500;">查看数据管理</button>
            </a>
        </div>
    </div>

    <script src="data-manager.js"></script>
    <script src="script.js"></script>
</body>
</html>
